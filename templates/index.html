
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitBuddy AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header class="hero">
            <p class="tag">YOUR PERSONAL FITNESS ASSISTANT</p>
            <h1>FitBuddy <span>AI</span></h1>
            <p>Create a workout plan that fits your goals.</p>
        </header>

        <section class="card">
            <h2>Create Your Plan</h2>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form action="/generate" method="post">
                <label for="name">Your name</label>
                <input id="name" name="name"
                       maxlength="100" required>

                <label for="age">Age</label>
                <input id="age" name="age" type="number"
                       min="13" max="100" value="18" required>

                <label for="goal">Fitness goal</label>
                <select id="goal" name="goal" required>
                    <option>General fitness</option>
                    <option>Build strength</option>
                    <option>Improve stamina</option>
                    <option>Flexibility and mobility</option>
                </select>

                <label for="level">Fitness level</label>
                <select id="level" name="level" required>
                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </select>

                <label for="days">Workout days</label>
                <select id="days" name="days" required>
                    <option value="1">1 day</option>
                    <option value="2">2 days</option>
                    <option value="3">3 days</option>
                    <option value="4" selected>4 days</option>
                    <option value="5">5 days</option>
                    <option value="6">6 days</option>
                    <option value="7">7 days</option>
                </select>

                <button type="submit">Generate My Plan →</button>
            </form>
        </section>

        <footer>
            <a href="/view-all-users">View Saved Plans</a>
        </footer>
    </main>
</body>
</html>
